yaml
name: Deploy Azure Infrastructure

on:
  push:
    branches:
      - main  # Trigger this pipeline every time you push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the code from GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Log into Azure using the secret we created
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Deploy the Bicep template to the Resource Group
      - name: Deploy Bicep Template
        uses: azure/arm-deploy@v1
        with:
          resourceGroupName: rg-devops-journeyß
          template: ./main.bicep # Path to your main file